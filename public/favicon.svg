<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="AgroData">
  <!-- Árbol de guayaba con la paleta de la app: fondo verde del header, copa
       verde clara y tronco dorado. Poca figura a propósito: a 16px (la pestaña
       del navegador) un dibujo detallado se vuelve una mancha.
       Sin ramas: asomaban por debajo de la copa y se leían como una grieta. -->
  <rect width="512" height="512" rx="112" fill="#16221a"/>

  <!-- Tronco -->
  <rect x="238" y="272" width="36" height="148" rx="18" fill="#c88a2e"/>

  <!-- Copa: círculos superpuestos, que a tamaño chico se funden en una sola masa -->
  <g fill="#8fbf6a">
    <circle cx="256" cy="156" r="76"/>
    <circle cx="172" cy="232" r="68"/>
    <circle cx="340" cy="232" r="68"/>
    <circle cx="256" cy="230" r="88"/>
  </g>

  <!-- Guayabas -->
  <circle cx="194" cy="214" r="17" fill="#e3ad52"/>
  <circle cx="314" cy="182" r="14" fill="#e3ad52"/>
  <circle cx="292" cy="262" r="12" fill="#e3ad52"/>
</svg>
